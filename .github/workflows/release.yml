# Publishes @ilkal/fonts, then @ilkal/sdk, to npm, with provenance, when a maintainer pushes a
# version tag (vX.Y.Z). The two are released together at the same version: the SDK loads its
# fonts from @ilkal/fonts at its own version, so the fonts go first. It runs in the protected
# `npm` environment, which the owner approves each time.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing and provenance both prove the build came from this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag names the SDK's version, and the fonts' is the same
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          fonts=$(node -p "require('./packages/fonts/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match @ilkal/sdk $version. Run pnpm changeset version, merge, then tag."
            exit 1
          fi
          if [ "$fonts" != "$version" ]; then
            echo "::error::@ilkal/fonts is $fonts, not $version: the SDK loads the fonts of its own version. Release them together (.changeset/config.json fixes the two)."
            exit 1
          fi
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      # pnpm packs each package (resolving workspace versions); npm publishes the tarballs, since
      # npm's CLI carries trusted publishing and provenance. npm 11.5 or later is needed for both.
      # The build filled @ilkal/fonts from the SDK's build (packages/fonts/scripts/build-fonts.ts).
      - run: pnpm --filter @ilkal/fonts pack --pack-destination "$RUNNER_TEMP"
      - run: pnpm --filter @ilkal/sdk pack --pack-destination "$RUNNER_TEMP"
      # The fonts first: an SDK published without them would load fonts that are not there.
      - name: Publish @ilkal/fonts with provenance
        env:
          # Empty when npm trusted publishing is set up for this workflow; otherwise the owner
          # sets an automation token as the environment's NPM_TOKEN secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --yes npm@11.21.1 publish "$RUNNER_TEMP"/ilkal-fonts-*.tgz --provenance --access public
      - name: Publish @ilkal/sdk with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --yes npm@11.21.1 publish "$RUNNER_TEMP"/ilkal-sdk-*.tgz --provenance --access public
